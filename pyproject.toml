[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dapple"
version = "0.1.0.dev0"
description = "Conservative, reproducible mass-spec imaging in napari"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "dapple contributors" }]
keywords = ["napari", "mass-spectrometry", "imaging", "MSI", "imzML"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: napari",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "napari>=0.6,<0.7",
    "magicgui>=0.10,<0.11",
    "qtpy>=2.4",
    "numpy>=2.1,<3",
    "scipy>=1.16,<2",
    "pandas>=2.2",
    "scikit-image>=0.24",
    "scikit-learn>=1.4",
    "dask[array]>=2024.1",
    "zarr>=2.18,<3",
    "pyimzml>=1.5",
    "tifffile>=2024.8",
    "imagecodecs",
    "netCDF4>=1.7",
    "lxml>=5",
    "psutil>=5.9",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-cov>=5",
    "pytest-benchmark>=4",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
]
cuda = ["torch", "onnxruntime-gpu"]
directml = ["torch-directml", "onnxruntime-directml"]
mps = ["torch"]

[project.urls]
Homepage = "https://github.com/napari/dapple"
"Bug Tracker" = "https://github.com/napari/dapple/issues"

[project.entry-points."napari.manifest"]
dapple = "dapple:napari.yaml"

[project.scripts]
dapple-apply-spec = "dapple.cli.apply_spec:main"
dapple-cohort-align = "dapple.cli.cohort_align:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dapple"]

[tool.hatch.build.targets.wheel.shared-data]
"src/dapple/napari.yaml" = "share/napari/manifest/dapple/napari.yaml"

[tool.hatch.build.targets.wheel.force-include]
"src/dapple/napari.yaml" = "dapple/napari.yaml"
"src/dapple/io/spec_xml.xsd" = "dapple/io/spec_xml.xsd"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_data: requires real datasets at C:/Users/pavak/MSI/datasets (gated by MSI_REAL_DATA=1)",
    "slow: long-running tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:napari.*",
    # pyimzml warns when imzML uses legacy CV-term names like "pixel size x" rather than
    # "pixel size (x)". Both jerboa-100825.imzML and root1-total-ion-count.imzML use the
    # legacy spelling (so does SCiLS Lab v14 in general), and we don't want every load to
    # trip this. Tracked: https://github.com/alexandrovteam/pyimzml ontology lookup.
    "ignore:Accession .*found with incorrect name.*:UserWarning",
    # netCDF4 wheels published before numpy 2.4 trigger a benign C-ABI mismatch warning.
    # The wheel still works; the size mismatch is in unused dtype fields.
    "ignore:numpy.ndarray size changed.*:RuntimeWarning",
    # napari + pydantic v1 deepcopies of itertools state on Python 3.12.
    "ignore:Pickle, copy, and deepcopy support will be removed from itertools.*:DeprecationWarning",
    # napari/vispy occasionally surface their own deprecation chatter during teardown.
    "ignore::DeprecationWarning:vispy.*",
    "ignore::DeprecationWarning:napari_console.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
packages = ["dapple"]
